<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測評量 · 會考考古題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBF7EE; --ink:#2B2620; --line:#E4DBC8; --accent:#2E6BE0; --correct:#2E9E5B; --wrong:#D94F4F; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Noto Sans TC', sans-serif;
    min-height:100vh; display:flex; justify-content:center; padding:2rem 1.2rem 4rem;
  }
  .sheet{ width:100%; max-width:560px; }
  .eyebrow{ font-size:0.78rem; letter-spacing:0.18em; color:#8A8171; font-weight:700; margin:0 0 0.3rem 2px; }
  h1{ font-family:'Zen Maru Gothic', sans-serif; font-size:1.7rem; margin:0 0 0.8rem; }
  .mode-switch{ display:flex; gap:0.5rem; margin-bottom:1.6rem; }
  .mode-switch a{
    flex:1; text-align:center; text-decoration:none; padding:0.7rem; border-radius:10px;
    font-weight:700; font-size:0.92rem; border:1.5px solid var(--line); color:#6B6355; background:#fff;
  }
  .mode-switch a.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .card{
    background:#fff; border-radius:14px; padding:1.5rem;
    box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -12px rgba(43,38,32,0.18);
    margin-bottom:1rem; cursor:pointer; transition:box-shadow 0.15s ease;
  }
  .card:hover{ box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 10px 28px -12px rgba(43,38,32,0.28); }
  .card .exam-name{ font-weight:700; font-size:1.05rem; }
  .card .meta{ color:#8A8171; font-size:0.85rem; margin-top:0.3rem; }
  .error-box{
    background:#FDECEC; border:1.5px solid #E8A0A0; color:#A33; border-radius:10px;
    padding:0.9rem 1rem; margin-bottom:1.2rem; font-size:0.9rem;
  }
  /* 作答畫面共用樣式（跟quiz-answer.html一致） */
  .progress{ font-size:0.85rem; color:#8A8171; font-weight:700; margin-bottom:1rem; }
  .qcard{
    background:#fff; border-radius:14px; padding:1.5rem;
    box-shadow:0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -12px rgba(43,38,32,0.18);
    margin-bottom:1rem;
  }
  .qtext{ font-size:1.02rem; line-height:1.7; margin-bottom:1rem; white-space:pre-wrap; }
  .opt{
    display:block; width:100%; text-align:left; border:1.5px solid var(--line);
    background:#fff; border-radius:10px; padding:0.8rem 1rem; margin-bottom:0.55rem;
    font-family:'Noto Sans TC', sans-serif; font-size:0.96rem; cursor:pointer;
  }
  .opt.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, white); font-weight:700; }
  .opt.correct{ border-color:var(--correct); background:color-mix(in srgb, var(--correct) 12%, white); }
  .opt.wrong{ border-color:var(--wrong); background:color-mix(in srgb, var(--wrong) 12%, white); }
  .qnum-badge{
    display:inline-block; background:var(--accent); color:#fff; font-weight:700;
    border-radius:6px; padding:0.15rem 0.5rem; font-size:0.85rem; margin-bottom:0.5rem;
  }
  .figure-note{ color:#B08A2B; font-size:0.85rem; margin-bottom:0.6rem; }
  button.primary{
    width:100%; border:none; border-radius:12px; padding:1rem; margin-top:1rem;
    font-family:'Noto Sans TC', sans-serif; font-size:1.02rem; font-weight:700;
    color:#fff; background:var(--accent); cursor:pointer;
  }
  .result-card{ text-align:center; padding:2.5rem 1.5rem; }
  .result-score{ font-family:'Zen Maru Gothic', sans-serif; font-size:3rem; font-weight:700; margin:0.5rem 0; }
</style>
</head>
<body>
<div class="sheet">
  <p class="eyebrow">會考練習</p>
  <h1>選一份考古題</h1>
  <div class="mode-switch">
    <a href="quiz-selector.html">課本練習</a>
    <a href="exam-practice.html" class="active">會考考古題</a>
  </div>
  <div id="app">載入中...</div>
</div>

<script>
  const API_BASE = '/quiz-api';
  const app = document.getElementById('app');

  function renderError(msg){
    app.innerHTML = `<div class="error-box">${msg}</div>`;
  }

  async function showExamList(){
    try{
      const res = await fetch(`${API_BASE}/api/exam-practice/exams`);
      if(!res.ok) throw new Error(`載入考卷清單失敗（${res.status}）`);
      const exams = await res.json();
      if(exams.length === 0){ renderError('目前資料庫還沒有會考題目。'); return; }
      app.innerHTML = exams.map(e => `
        <div class="card" data-exam="${e.exam_name}" data-subject="${e.subject}">
          <div class="exam-name">${e.exam_name} · ${e.subject_label}</div>
          <div class="meta">共 ${e.question_count} 題</div>
        </div>
      `).join('');
      app.querySelectorAll('.card').forEach(card=>{
        card.addEventListener('click', ()=>{
          startExam(card.dataset.exam, card.dataset.subject);
        });
      });
    }catch(e){ renderError(e.message); }
  }

  let currentQuestions = [];
  let currentIndex = 0;
  let answers = {}; // question_number(string) -> key
  let examName = '', subject = '';

  async function startExam(en, subj){
    examName = en; subject = subj;
    answers = {}; currentIndex = 0;
    app.innerHTML = '載入題目中...';
    try{
      const params = new URLSearchParams({ exam_name: en, subject: subj });
      const res = await fetch(`${API_BASE}/api/exam-practice/questions?${params}`);
      if(!res.ok) throw new Error(`載入題目失敗（${res.status}）`);
      currentQuestions = await res.json();
      renderQuestion();
    }catch(e){ renderError(e.message); }
  }

  function renderQuestion(){
    const q = currentQuestions[currentIndex];
    const selected = answers[String(q.question_number)];
    const optionsHtml = (q.options || []).map(o=>{
      const cls = 'opt' + (selected === o.key ? ' selected' : '');
      return `<button class="${cls}" data-key="${o.key}">(${o.key}) ${o.text}</button>`;
    }).join('');
    const figureNote = q.has_figure ? `<div class="figure-note">⚠️ 這題含圖表，題幹可能不完整，僅供參考</div>` : '';

    app.innerHTML = `
      <div class="progress">第 ${currentIndex+1} / ${currentQuestions.length} 題</div>
      <div class="qcard">
        <div class="qnum-badge">第 ${q.question_number} 題</div>
        ${figureNote}
        <div class="qtext">${q.question_text}</div>
        ${optionsHtml}
      </div>
      <div style="display:flex; gap:0.7rem;">
        ${currentIndex > 0 ? `<button class="primary" id="prevBtn" style="background:#8A8171;">上一題</button>` : ''}
        <button class="primary" id="nextBtn">${currentIndex === currentQuestions.length - 1 ? '交卷看成績' : '下一題'}</button>
      </div>
    `;

    app.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        answers[String(q.question_number)] = btn.dataset.key;
        renderQuestion();
      });
    });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ currentIndex--; renderQuestion(); });
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if(currentIndex < currentQuestions.length - 1){ currentIndex++; renderQuestion(); }
      else{ submitAll(); }
    });
  }

  async function submitAll(){
    app.innerHTML = '結算成績中...';
    try{
      const res = await fetch(`${API_BASE}/api/exam-practice/grade`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ exam_name: examName, subject: subject, answers: answers }),
      });
      if(!res.ok) throw new Error(`結算失敗（${res.status}）`);
      const data = await res.json();
      const pct = data.total ? Math.round(data.correct / data.total * 100) : 0;
      const detailRows = data.details.map(d => `
        <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--line); font-size:0.9rem;">
          <span>第 ${d.question_number} 題</span>
          <span style="color:${d.is_correct ? 'var(--correct)' : 'var(--wrong)'}; font-weight:700;">
            ${d.submitted || '未作答'} ${d.is_correct ? '✓' : `✗（正解 ${d.correct_option || '－'}）`}
          </span>
        </div>
      `).join('');
      app.innerHTML = `
        <div class="qcard result-card">
          <div style="color:#8A8171; font-weight:700;">${examName} ${subject}</div>
          <div class="result-score">${data.correct} / ${data.total}</div>
          <div style="color:#8A8171;">答對率 ${pct}%</div>
        </div>
        <div class="qcard" style="text-align:left;">${detailRows}</div>
        <button class="primary" onclick="location.href='exam-practice.html'">再選一份</button>
      `;
    }catch(e){ renderError(e.message); }
  }

  showExamList();
</script>
</body>
</html>
