<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1a"><title>線上有位｜市場星系</title><script>try{const t=localStorage.getItem('market-v2-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="/stock/new/css/market-v2.css"><script defer src="/stock/new/js/data-adapter.js"></script><script defer src="/stock/new/js/market-layout.js"></script><script defer src="/stock/new/js/market-scene.js"></script><script defer src="/stock/new/js/app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/stock/" aria-label="線上有位市場首頁"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M5 23V14L13 6v17M18 23V11l7-5v17"/></svg><b>線上有位</b></a><nav class="desktop-nav" aria-label="主要導覽"><button aria-current="page">市場</button><button onclick="location.href='/stock/?page=picks'">發現</button><button onclick="location.href='/stock/?page=watch'">自選</button><button onclick="location.href='/stock/?old=1'">個股</button><button onclick="location.href='/stock/?page=my'">設定</button></nav><div class="top-actions"><span id="dataLabel" class="mock-tag">新版</span><button id="lite" class="quiet-button" aria-pressed="false">輕量</button><button id="theme" class="icon-button" aria-label="切換主題">◐</button><button id="settingsToggle" class="icon-button" aria-label="顯示設定" aria-expanded="false">⋯</button></div></header>
<main>
<section class="market-heading"><div><div class="title-row"><h1>市場星系</h1><span id="marketState" class="state-tag">讀取中</span></div><div class="meta"><span id="tradeDate">—</span><span>資料時間 <b id="dataTime">—</b></span><span id="poolCount" class="desktop-only"></span></div></div></section>
<div class="settings-panel" id="settings" hidden><label>主題 <select id="themeChoice"><option value="system">跟隨系統</option><option value="dark">深色</option><option value="light">淺色</option></select></label><label hidden>情境 <select id="scenario"></select></label></div>
<section id="summaryBar" class="summary-bar" aria-label="市場摘要"></section><div class="galaxy-grid"><div class="galaxy-column"><div class="scene-status"><span id="visibleCount"></span><span id="replayState"></span></div>
<section class="scene-wrap" id="sceneWrap" aria-label="市場星團場域"><svg id="galaxy" class="market-field" role="group" aria-label="族群星球：按 Enter 或點擊查看詳情"></svg><div id="empty" class="empty" hidden></div><div id="hoverCard" class="hover-card" role="tooltip" hidden></div></section>
<div id="clusterStrip" class="cluster-strip"></div><section id="clusterExpand" hidden><button id="collapseCluster" class="quiet-button">收合星團</button><svg id="expandedGalaxy" class="market-field"></svg></section><details class="legend-wrap" id="legend"><summary>圖例與固定色階</summary><div class="legend-main"><span><i class="size-symbol"></i>大小＝活躍度</span><span><i class="heat-symbol"></i>紅漲綠跌</span><span><i class="glow-symbol"></i>雙圈＝升溫 ≥ 5</span></div><div id="scaleLegend" class="scale-legend"></div><p>星球點擊可查看完整資訊。短線連接球外標籤，其餘連線僅為裝飾。</p><p>星團成交占比為族群加總，股票可能重複計入，僅供參考</p></details></div><aside id="highlights" class="highlights"><div id="highlightLists"></div></aside></div><section class="watch-strip" id="watchStrip" aria-label="我的自選摘要"></section>
<section class="timeline-panel" aria-label="今日市場回放"><div class="timeline-head"><div><h2>焦點輪動</h2><span id="snapshotStep" class="desktop-only"></span></div><div class="timeline-actions"><button id="previous" class="icon-button" aria-label="前一筆快照">‹</button><button id="play" class="play-button" aria-label="播放回放">▶</button><button id="next" class="icon-button" aria-label="下一筆快照">›</button><button id="latest" class="quiet-button">最新</button></div></div><div class="current-focus" id="currentFocus"></div><p id="rotationNote" class="detail-note"></p><div class="time-track"><svg id="rotationBand" aria-label="各時段領先族群的漲跌色帶"></svg><div id="timeCursor" class="time-cursor"></div><input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="市場回放時間"></div><div class="time-endpoints"><span id="startTime"></span><output id="timeOutput" for="timeline"></output><span id="endTime"></span></div><div id="focusStops" class="focus-stops" aria-label="焦點交棒時段"></div></section>
<section id="entries" class="entries" aria-label="延伸入口"></section><p style="font-size:11px;color:var(--muted);text-align:center;padding:14px 6px 0;margin:0">資訊僅供參考，不構成投資建議</p><footer><span id="source">讀取中</span><span>新版試跑中 · <a href="/stock/?old=1">舊版首頁</a></span></footer>
<nav class="mobile-nav" aria-label="主要導覽"><button aria-current="page"><span>◉</span>市場</button><button onclick="location.href='/stock/?page=picks'"><span>⌕</span>發現</button><button onclick="location.href='/stock/?page=watch'"><span>☆</span>自選</button><button onclick="location.href='/stock/?old=1'"><span>▥</span>個股</button><button onclick="location.href='/stock/?page=my'"><span>⚙</span>設定</button></nav>
</main>
<div id="detailBackdrop" class="detail-backdrop" hidden></div><aside id="detail" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden><div class="sheet-handle"></div><button id="closeDetail" class="close-button" aria-label="關閉族群詳情">×</button><div id="detailBody"></div></aside><dialog id="routeNotice"><h2 id="routeTitle"></h2><p>正式站入口，Demo 未開放</p><button id="closeRoute" class="quiet-button">關閉</button></dialog><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
