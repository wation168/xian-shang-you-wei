<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Search & Website Intelligence</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="app">

    <!-- 1. Landing -->
    <section id="view-landing" class="landing">
      <div class="badge"><span class="dot"></span> 給網站主人的健康檢查</div>
      <h1>你的網站，別人找不找得到？</h1>
      <p class="lead">貼上網址，我們用白話告訴你三件事：<br/>搜尋看不看得到、AI 提不提得到、網站本身健不健康。<br/>你不需要先懂 SEO。</p>
      <div class="glass hero-panel">
        <div class="value-points">
          <div class="vp"><span class="vp-num">1</span><div><strong>輸入網址</strong> — 就像健檢前填資料</div></div>
          <div class="vp"><span class="vp-num">2</span><div><strong>等它看完</strong> — 畫面會顯示「正在理解你的網站」</div></div>
          <div class="vp"><span class="vp-num">3</span><div><strong>看結果與下一步</strong> — 先看「現在最該注意什麼」，再決定要不要改</div></div>
        </div>
        <div class="input-row">
          <input id="url-input" type="url" placeholder="貼上你的網站，例如 https://你的網域.com" value="https://www.djangoproject.com/weblog/" />
          <button class="btn" id="btn-analyze">幫我看看這個網站</button>
        </div>
        <p class="muted" style="margin:14px 0 0">這版先用示範網站資料，讓你走完整流程。重點是：看懂它「能幫你什麼」。</p>
        <div class="demos" id="demo-chips"></div>
      </div>
    </section>

    <!-- 2. Scan animation -->
    <section id="view-scan" class="scan hidden">
      <div class="glass scan-stage">
        <div class="orbit"></div>
        <div class="orbit orbit2"></div>
        <span class="node"></span><span class="node"></span><span class="node"></span>
        <div class="beam"></div>
        <h2 class="scan-title">AI 正在理解你的網站</h2>
        <p class="scan-sub" id="scan-url-label"></p>
        <div class="steps" id="scan-steps"></div>
      </div>
    </section>

    <!-- 3. Intelligence Center -->
    <section id="view-dash" class="hidden">
      <div class="topbar">
        <div>
          <div class="eyebrow">Website Intelligence</div>
          <h2>你的網站健檢結果</h2>
          <div class="muted" id="dash-site-label"></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn ghost" id="btn-home">回到首頁</button>
          <button class="btn ghost" id="btn-rescan">再分析一次</button>
        </div>
      </div>

      <div class="glass panel result-hero" id="result-hero"></div>
      <div class="pillars" id="pillars"></div>

      <div id="detail-root" class="hidden">
        <button class="btn ghost back" id="btn-back-pillars">← 回到四柱總覽</button>
        <div id="detail-body"></div>
      </div>

      <div id="overview-extras">
        <div class="glass panel">
          <div class="section-head">
            <h3>現在最值得先看的地方</h3>
          </div>
          <p class="muted">不用一次看懂全部。先處理最上面的；專業詞都藏在「查看詳細證據」。</p>
          <div class="issues" id="top-issues"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
