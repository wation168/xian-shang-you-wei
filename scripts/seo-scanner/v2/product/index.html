<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Search & Website Intelligence</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <div class="app">

    <!-- 1. Landing -->
    <section id="view-landing" class="landing">
      <div class="badge"><span class="dot"></span> AI Search & Website Intelligence</div>
      <h1>AI Search & Website Intelligence</h1>
      <p class="lead">分析你的網站，看看搜尋引擎與 AI 是否看得懂、找得到、願意引用。</p>
      <div class="glass hero-panel">
        <div class="input-row">
          <input id="url-input" type="url" placeholder="輸入你的網站網址，例如 https://example.com" value="https://www.djangoproject.com/weblog/" />
          <button class="btn" id="btn-analyze">開始分析</button>
        </div>
        <p class="muted" style="margin:12px 0 0; text-align:left">第一版會用本機 Scanner 真實掃描結果當 Demo（不必先懂 SEO／GEO／AEO）。</p>
        <div class="demos" id="demo-chips"></div>
      </div>
    </section>

    <!-- 2. Scan animation -->
    <section id="view-scan" class="scan hidden">
      <div class="glass scan-stage">
        <div class="orbit"></div>
        <div class="orbit orbit2"></div>
        <span class="node"></span><span class="node"></span><span class="node"></span>
        <div class="beam"></div>
        <h2 class="scan-title">AI 正在理解你的網站</h2>
        <p class="scan-sub" id="scan-url-label"></p>
        <div class="steps" id="scan-steps"></div>
      </div>
    </section>

    <!-- 3. Intelligence Center -->
    <section id="view-dash" class="hidden">
      <div class="topbar">
        <div>
          <h2>Intelligence Center</h2>
          <div class="muted" id="dash-site-label"></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn ghost" id="btn-home">回到首頁</button>
          <button class="btn ghost" id="btn-rescan">再分析一次</button>
        </div>
      </div>

      <div class="pillars" id="pillars"></div>

      <!-- Detail panes -->
      <div id="detail-root" class="hidden">
        <button class="btn ghost back" id="btn-back-pillars">← 回到四柱總覽</button>
        <div id="detail-body"></div>
      </div>

      <div id="overview-extras">
        <div class="glass panel">
          <h3>現在最需要注意的事</h3>
          <p class="muted">用白話列出優先項目。專業術語在「查看詳細證據」。</p>
          <div class="issues" id="top-issues"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
