    <div class="g2048-topbar">
      <span>{{ui.scoreLabel}}<span id="g2048Score">0</span></span>
      <span class="g2048-best-badge">{{ui.bestLabel}}<span id="g2048BestInline">0</span></span>
    </div>

    <div class="g2048-board" id="g2048Board">
      <div class="g2048-grid" id="g2048Grid"></div>
      <div class="g2048-overlay" id="g2048Overlay">
        <div class="g2048-over-title" id="g2048OverTitle">{{ui.gameOverInit}}</div>
        <div class="g2048-over-sub" id="g2048OverSub">{{ui.scoreInit}}</div>
        <div class="g2048-overlay-actions">
          <button class="game-btn" onclick="g2048Restart()">{{chrome.playAgain}}</button>
          <button class="game-btn secondary" id="g2048ContinueBtn" onclick="g2048Continue()" style="display:none">{{ui.continueBtn}}</button>
        </div>
      </div>
    </div>
    <div class="g2048-hint">{{ui.hint}}</div>

    <div class="game-rating" id="g2048Rating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{chrome.bestScore}}</div><div class="gs-value" id="g2048Best">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.maxTileLabel}}</div><div class="gs-value" id="g2048BestTile">—</div></div>
    </div>
    <div class="game-history" id="g2048History"></div>

    <div class="game-controls">
      <button class="game-btn" id="g2048StartBtn" onclick="g2048Restart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="g2048ShareResult()">{{chrome.shareBtn}}</button>
    </div>
