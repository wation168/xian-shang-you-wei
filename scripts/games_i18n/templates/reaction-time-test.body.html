    <div class="game-stage" id="rtStage">
      <div class="stage-text" id="rtStageText">{{ui.idleMain}}</div>
      <div class="stage-sub" id="rtStageSub">{{ui.idleSub}}</div>
    </div>

    <div class="game-rating" id="rtRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="rtBest">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.avgLabel}}</div><div class="gs-value" id="rtAvg">—</div></div>
    </div>
    <div class="game-history" id="rtHistory"></div>

    <div class="game-controls">
      <button class="game-btn secondary" onclick="rtShareResult()">{{chrome.shareBtn}}</button>
    </div>
