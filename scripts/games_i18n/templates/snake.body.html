    <div class="sn-topbar">
      <span>{{ui.scoreLabel}}<span id="snScore">0</span></span>
      <span class="sn-level-badge" id="snLevelBadge">Lv.1</span>
    </div>

    <div class="sn-board" id="snBoard"></div>

    <div class="sn-dpad">
      <button class="sn-up" onclick="snSetDir('up')" aria-label="{{ui.dirUp}}">↑</button>
      <button class="sn-left" onclick="snSetDir('left')" aria-label="{{ui.dirLeft}}">←</button>
      <button class="sn-right" onclick="snSetDir('right')" aria-label="{{ui.dirRight}}">→</button>
      <button class="sn-down" onclick="snSetDir('down')" aria-label="{{ui.dirDown}}">↓</button>
    </div>

    <div class="game-rating" id="snRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="snBest">—</div></div>
    </div>
    <div class="game-history" id="snHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="snStartBtn" onclick="snStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="snShareResult()">{{chrome.shareBtn}}</button>
    </div>
