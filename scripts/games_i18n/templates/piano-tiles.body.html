    <div class="pt-topbar">
      <span>{{ui.scoreLabel}}<span id="ptScore">0</span></span>
      <span class="pt-level-badge" id="ptLevelBadge">Lv.1</span>
      <span>🎵 {{ui.nowPlaying}}<span id="ptSongName">—</span></span>
    </div>

    <div class="pt-board" id="ptBoard">
      <div class="pt-col" data-col="0"></div>
      <div class="pt-col" data-col="1"></div>
      <div class="pt-col" data-col="2"></div>
      <div class="pt-col" data-col="3"></div>
      <div class="pt-col" data-col="4"></div>
      <div class="pt-overlay" id="ptOverlay">
        <div class="pt-over-title" id="ptOverTitle">{{ui.readyTitle}}</div>
        <div class="pt-over-sub" id="ptOverSub">{{ui.readySub}}</div>
      </div>
    </div>

    <div class="game-rating" id="ptRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="ptBest">—</div></div>
    </div>
    <div class="game-history" id="ptHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="ptStartBtn" onclick="ptStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" id="ptSoundBtn" onclick="ptToggleSound()">{{ui.soundOnBtn}}</button>
      <button class="game-btn secondary" onclick="ptShareResult()">{{chrome.shareBtn}}</button>
    </div>
