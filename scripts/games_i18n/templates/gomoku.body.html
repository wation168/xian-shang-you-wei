    <div class="gk-mode-row">
      <button class="gk-mode-btn active" id="gkModeAiBtn" onclick="gkSetMode('ai')">{{ui.modeAiBtn}}</button>
      <button class="gk-mode-btn" id="gkMode2pBtn" onclick="gkSetMode('2p')">{{ui.mode2pBtn}}</button>
    </div>

    <div class="gk-topbar">
      <span id="gkTurnText">{{ui.initialTurnText}}</span>
      <span class="gk-turn-dot" id="gkTurnDot" style="background:#0f172a"></span>
    </div>

    <div class="gk-board" id="gkBoard"></div>

    <div class="game-rating" id="gkRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label" id="gkP1Label">{{ui.initialP1Label}}</div><div class="gs-value" id="gkP1Wins">0</div></div>
      <div class="game-score-tile"><div class="gs-label" id="gkP2Label">{{ui.initialP2Label}}</div><div class="gs-value" id="gkP2Wins">0</div></div>
    </div>

    <div class="game-controls">
      <button class="game-btn" onclick="gkRestart()">{{ui.restartRoundBtn}}</button>
      <button class="game-btn secondary" onclick="gkShareResult()">{{chrome.shareBtn}}</button>
    </div>
