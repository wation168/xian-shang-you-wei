    <div class="mm-topbar">
      <span>{{ui.movesLabel}}<span id="mmMoves">0</span></span>
      <span>{{ui.timeLabel}}<span id="mmTime">0</span>{{ui.timeUnit}}</span>
      <span>{{ui.pairsLabel}}<span id="mmPairs">0</span>/8</span>
    </div>

    <div class="mm-board" id="mmBoard"></div>

    <div class="game-rating" id="mmRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="mmBest">—</div></div>
    </div>
    <div class="game-history" id="mmHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="mmStartBtn" onclick="mmStart()">{{chrome.restartBtn}}</button>
      <button class="game-btn secondary" onclick="mmShareResult()">{{chrome.shareBtn}}</button>
    </div>
