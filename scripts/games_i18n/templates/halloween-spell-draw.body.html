    <div class="hw-topbar">
      <span>{{ui.scoreLabel}}<span id="hwScore">0</span></span>
      <span class="hw-wave-badge" id="hwWaveBadge">{{ui.initialWaveBadge}}</span>
      <span class="hw-lives">{{ui.livesLabel}}<span id="hwLives">❤️❤️❤️❤️❤️</span></span>
    </div>

    <div class="hw-board" id="hwBoard">
      <canvas id="hwCanvas"></canvas>
      <div class="hw-overlay" id="hwOverlay">
        <div class="hw-over-title" id="hwOverTitle">{{ui.readyTitle}}</div>
        <div class="hw-over-sub" id="hwOverSub">{{ui.readySub}}</div>
      </div>
    </div>

    <div class="hw-shape-hint" id="hwShapeHint"></div>

    <div class="game-rating" id="hwRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="hwBest">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.bestWaveLabel}}</div><div class="gs-value" id="hwBestWave">—</div></div>
    </div>
    <div class="game-history" id="hwHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="hwStartBtn" onclick="hwStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" id="hwSoundBtn" onclick="hwToggleSound()">{{ui.soundOnBtn}}</button>
      <button class="game-btn secondary" onclick="hwShareResult()">{{chrome.shareBtn}}</button>
    </div>
