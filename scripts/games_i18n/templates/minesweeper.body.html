    <div class="ms-topbar">
      <span>{{ui.scoreLabel}}<span id="msScore">0</span></span>
      <span class="ms-diff-badge" id="msDiffBadge">{{ui.diffBeginnerLabel}}</span>
      <span>💣 <span id="msMinesLeft">10</span></span>
      <span>⏱ <span id="msTimer">000</span></span>
      <button class="ms-face-btn" id="msFaceBtn" onclick="msStart()" title="{{ui.restartTitle}}">🙂</button>
    </div>
    <div style="text-align:center;margin-bottom:10px">
      <button class="ms-flagmode-btn" id="msFlagModeBtn" onclick="msToggleFlagMode()">{{ui.flagModeInitial}}</button>
    </div>

    <div class="ms-wrap">
      <div class="ms-board" id="msBoard"></div>
    </div>
    <div class="ms-overlay">
      <div class="ms-over-panel" id="msOverPanel">
        <div class="ms-over-title" id="msOverTitle">{{ui.readyTitle}}</div>
        <div class="ms-over-sub" id="msOverSub">{{ui.readySub}}</div>
      </div>
    </div>
    <div class="ms-hint">{{ui.hintText}}</div>

    <div class="game-rating" id="msRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="msBest">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.bestDiffLabel}}</div><div class="gs-value" id="msBestDiff">—</div></div>
    </div>
    <div class="game-history" id="msHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="msStartBtn" onclick="msStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="msShareResult()">{{chrome.shareBtn}}</button>
    </div>
