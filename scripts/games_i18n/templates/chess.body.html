    <div class="ch-mode-select" id="chModeSelect">
      <button class="ch-mode-btn" onclick="chChooseMode('pvp')">
        <div class="ch-mode-title">{{ui.modePvpTitle}}</div>
        <div class="ch-mode-desc">{{ui.modePvpDesc}}</div>
      </button>
      <button class="ch-mode-btn" onclick="chChooseMode('pve')">
        <div class="ch-mode-title">{{ui.modePveTitle}}</div>
        <div class="ch-mode-desc">{{ui.modePveDesc}}</div>
      </button>
      <div class="ch-diff-row" id="chDiffRow" style="display:none">
        <button data-diff="easy" onclick="chSetDifficulty('easy')">{{ui.diffEasy}}</button>
        <button data-diff="medium" onclick="chSetDifficulty('medium')">{{ui.diffMedium}}</button>
        <button data-diff="hard" onclick="chSetDifficulty('hard')">{{ui.diffHard}}</button>
      </div>
    </div>

    <div class="ch-board-wrap" id="chBoardWrap">
      <div class="ch-topbar">
        <span class="ch-turn-badge" id="chTurnBadge"></span>
        <span class="ch-check-badge" id="chCheckBadge">{{ui.checkText}}</span>
      </div>
      <div class="ch-board" id="chBoard">
        <div class="ch-grid" id="chGrid"></div>
        <div class="ch-promo" id="chPromo"></div>
        <div class="ch-overlay" id="chOverlay">
          <div class="ch-over-title" id="chOverTitle"></div>
          <div class="ch-over-sub" id="chOverSub"></div>
          <button class="game-btn" onclick="chBackToMenu()">{{chrome.playAgain}}</button>
        </div>
      </div>
      <div class="ch-thinking" id="chThinking"></div>
      <div class="ch-record"><span>{{ui.winLabel}}<span id="chWins">0</span></span><span>{{ui.lossLabel}}<span id="chLosses">0</span></span><span>{{ui.drawLabel}}<span id="chDraws">0</span></span></div>

      <div class="game-controls">
        <button class="game-btn secondary" onclick="chUndo()">{{ui.undoBtn}}</button>
        <button class="game-btn secondary" onclick="chBackToMenu()">{{ui.endBtn}}</button>
        <button class="game-btn secondary" onclick="chShareResult()">{{ui.shareBtn}}</button>
      </div>
      <div class="ch-movelist" id="chMoveList"></div>
    </div>
