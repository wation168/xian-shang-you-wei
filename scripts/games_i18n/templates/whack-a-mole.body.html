    <div class="wam-topbar">
      <span>{{ui.scoreLabel}}<span id="wamScore">0</span></span>
      <span class="wam-time" id="wamTimeWrap">{{ui.timeLabel}}<span id="wamTime">30</span>{{ui.timeUnit}}</span>
      <span class="wam-level-badge" id="wamLevelBadge">Lv.1</span>
      <span class="wam-toast" id="wamToast"></span>
    </div>

    <div class="wam-board" id="wamBoard"></div>

    <div class="game-rating" id="wamRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="wamBest">—</div></div>
    </div>
    <div class="game-history" id="wamHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="wamStartBtn" onclick="wamStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="wamShareResult()">{{chrome.shareBtn}}</button>
    </div>
