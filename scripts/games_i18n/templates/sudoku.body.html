    <div class="sk-topbar">
      <span>{{ui.scoreLabel}}<span id="skScore">0</span></span>
      <span class="sk-diff-badge" id="skDiffBadge">{{ui.diffEasyLabel}}</span>
      <span>{{ui.puzzlePrefix}}<span id="skPuzzleNum">1</span>{{ui.puzzleSuffix}}</span>
      <span>⏱ <span id="skTimer">00:00</span></span>
    </div>

    <div class="sk-board" id="skBoard">
      <div class="sk-grid" id="skGrid"></div>
      <div class="sk-overlay" id="skOverlay">
        <div class="sk-over-title" id="skOverTitle">{{ui.readyTitle}}</div>
        <div class="sk-over-sub" id="skOverSub">{{ui.readySub}}</div>
      </div>
    </div>

    <div class="sk-numpad" id="skNumpad"></div>

    <div class="game-rating" id="skRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="skBest">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.bestDiffLabel}}</div><div class="gs-value" id="skBestDiff">—</div></div>
    </div>
    <div class="game-history" id="skHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="skStartBtn" onclick="skStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="skHint()">{{ui.hintBtn}}</button>
      <button class="game-btn secondary" onclick="skClearEntries()">{{ui.clearEntriesBtn}}</button>
      <button class="game-btn secondary" onclick="skShareResult()">{{chrome.shareBtn}}</button>
    </div>
