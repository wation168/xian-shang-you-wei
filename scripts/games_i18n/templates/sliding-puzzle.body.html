    <div class="sp-topbar">
      <span>{{ui.scoreLabel}}<span id="spScore">0</span></span>
      <span class="sp-size-badge" id="spSizeBadge">3x3</span>
      <span>{{ui.movesLabel}}<span id="spMoves">0</span></span>
      <span>⏱ <span id="spTimer">00:00</span></span>
    </div>

    <div class="sp-board" id="spBoard">
      <div class="sp-grid" id="spGrid"></div>
      <div class="sp-overlay" id="spOverlay">
        <div class="sp-over-title" id="spOverTitle">{{ui.readyTitle}}</div>
        <div class="sp-over-sub" id="spOverSub">{{ui.readySub}}</div>
      </div>
    </div>
    <div class="sp-hint">{{ui.hint}}</div>

    <div class="game-rating" id="spRating"></div>

    <div class="game-score-row">
      <div class="game-score-tile"><div class="gs-label">{{ui.bestLabel}}</div><div class="gs-value" id="spBest">—</div></div>
      <div class="game-score-tile"><div class="gs-label">{{ui.bestSizeLabel}}</div><div class="gs-value" id="spBestSize">—</div></div>
    </div>
    <div class="game-history" id="spHistory"></div>

    <div class="game-controls">
      <button class="game-btn" id="spStartBtn" onclick="spStart()">{{chrome.startBtn}}</button>
      <button class="game-btn secondary" onclick="spShareResult()">{{chrome.shareBtn}}</button>
    </div>
