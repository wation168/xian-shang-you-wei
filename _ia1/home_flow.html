  <div id="homeDash">
    <div id="homeFlow">
      <section class="v5-hero">
        <div>
          <div class="v5-eyebrow">台股每日入口</div>
          <h1>今天市場，先看這裡</h1>
          <p>先掌握市場 → 找到值得注意的股票 → 再進一步分析</p>
        </div>
        <div class="v5-updated" id="homeHeroUpdated">資料更新後顯示台北時間</div>
      </section>

      <section class="v5-grid v5-top">
        <div class="v5-card" id="homeMktRow">
          <h2>今天市場發生什麼事</h2>
          <div class="v5-sub" id="homeMktMeta"></div>
          <div class="v5-markets" id="homeMktChips"></div>
        </div>
        <div class="v5-card" id="homeNewsBox"></div>
      </section>

      <section class="v5-grid v5-mid">
        <div class="v5-card" id="homeIndBox"></div>
        <div class="v5-card">
          <h2>今天看什麼</h2>
          <div class="v5-sub">把既有的精選與深度選股放到同一個入口</div>
          <div class="v5-pickGrid">
            <button type="button" class="v5-pick" onclick="_homeGo('picks')"><span class="v5-tag">開盤精選</span><b>今日精選標的</b><span class="v5-lock">依會員權限顯示</span></button>
            <button type="button" class="v5-pick" onclick="_homeGo('quotes')"><span class="v5-tag">熱門</span><b>市場熱門標的</b><span class="v5-lock">既有強勢列</span></button>
            <button type="button" class="v5-pick" onclick="_homeGo('deepanalysis')"><span class="v5-tag">深度選股</span><b>深入篩選結果</b><span class="v5-lock">付費會員完整開放</span></button>
            <button type="button" class="v5-pick" onclick="_homeGo('analyze')"><span class="v5-tag">個股分析</span><b>輸入股票直接分析</b><span class="v5-lock">依會員權限顯示</span></button>
          </div>
          <div class="v5-cta"><button type="button" class="v5-primary" onclick="_homeGo('picks')">查看全部機會</button></div>
        </div>
      </section>

      <section class="v5-grid v5-bottom">
        <div class="v5-card hd-sec">
          <h2>跟我有關</h2>
          <div class="v5-sub">自選股與持股健檢，成為每天回來的理由</div>
          <div class="ws-mobile-bar">
            <select id="wsGroupFilterM" class="ws-group-select" onchange="_onWsGroupFilterChangeM(this.value)"></select>
            <button class="ws-group-add" onclick="_wsToggleAddGroupM()" title="新增族群">＋</button>
            <button id="wsGroupEditM" class="ws-group-add" onclick="_wsRenameCurrentGroupM()" title="重新命名族群" style="display:none">✎</button>
            <button id="wsGroupDelM" class="ws-group-add" onclick="_wsDeleteCurrentGroupM()" title="刪除族群" style="display:none">🗑</button>
          </div>
          <div id="wsAddGroupRowM" class="ws-add-row" style="display:none;margin-bottom:10px">
            <input id="wsNewGroupInputM" placeholder="族群名稱，如：半導體" onkeydown="if(event.key==='Enter')_wsSubmitAddGroupM()">
            <button onclick="_wsSubmitAddGroupM()">新增</button>
          </div>
          <div id="homeWatchPreview"></div>
          <div class="v5-cta">
            <button type="button" class="v5-secondary" onclick="showPage('watch')">查看我的投資</button>
            <button type="button" class="v5-primary" onclick="showPage('portfolio')">持股健檢</button>
          </div>
        </div>
        <div class="v5-card v5-analyze" id="flowAnalyze">
          <h2>想深入看一檔股票？</h2>
          <div class="v5-sub">直接搜尋，進入核心個股分析</div>
          <div class="v5-cta"><button type="button" class="v5-primary" onclick="_homeGo('analyze')">開始分析</button></div>
        </div>
      </section>

      <section class="v5-card v5-deep">
        <h2>想看得更深？</h2>
        <div class="v5-sub">DEEP／完整深度分析</div>
        <b>把「資料」變成「解讀」</b>
        <p class="v5-lock">付費會員完整開放。這裡是會員價值的主要入口。</p>
        <div class="v5-cta">
          <button type="button" class="v5-upgrade" onclick="_homeGo('deep')">進入深度分析</button>
          <button type="button" class="v5-secondary" id="homeIaUpgrade" onclick="_homeGo('upgrade')">升級付費會員</button>
        </div>
      </section>
    </div>
  </div>
